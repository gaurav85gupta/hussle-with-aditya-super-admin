<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Admin Login | Hussle With Aditya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>Super Admin</h1>
    <p class="sub">Sign in to manage Hussle With Aditya.</p>
    <div id="banner"></div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <p class="field__err" id="e-email"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="field__err" id="e-password"></p>
      </div>
      <button class="btn btn--primary" type="submit" id="loginBtn" style="width:100%">Log in</button>
    </form>
  </div>
</div>
<script type="module" src="js/login.js"></script>
</body>
</html>
